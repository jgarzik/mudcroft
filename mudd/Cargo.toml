[package]
name = "mudd"
version = "0.1.0"
edition = "2024"
description = "Mudcroft server daemon"
license = "MIT"
publish = false

[[bin]]
name = "mudd"
path = "src/main.rs"

[[bin]]
name = "mudd_init"
path = "src/bin/init.rs"

[[bin]]
name = "mudd_admin"
path = "src/bin/admin.rs"

[lib]
name = "mudd"
path = "src/lib.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Web framework
axum = { version = "0.8", features = ["ws"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["trace", "cors", "fs", "compression-gzip", "set-header"] }

# Database
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite"] }

# Lua scripting
mlua = { version = "0.12", features = ["lua54", "vendored", "async", "serialize"] }

# Consensus (Raft)
openraft = { version = "0.10", features = ["serde", "type-alias"] }
# Cluster transport: framed messages over TLS (as in the sister project roodb)
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12"] }
futures-util = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging/tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Utilities
thiserror = "2"
anyhow = "1"
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.11"
argon2 = "0.6"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.10"
parking_lot = "0.12"

# HTTP client (for Venice AI)
reqwest = { version = "0.13", features = ["json", "rustls"], default-features = false }

# Zip file handling
zip = "9"
base64 = "0.23"

# Regex for validation
regex = "1"

tempfile = "3"

[dev-dependencies]
# Paused clock in tests (tokio::test(start_paused))
tokio = { version = "1", features = ["test-util"] }
tokio-tungstenite = "0.30"

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[lints.rust]
# src/ has no unsafe; the test harness opts in where it calls libc
unsafe_code = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }

[profile.release]
# Integer overflow (credits, HP, damage) panics instead of silently wrapping
overflow-checks = true
