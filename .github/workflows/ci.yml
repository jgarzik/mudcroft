name: CI

on:
  push:
    branches: [main]
    # Release tags are tested, then published as images
    tags: ['v*']
  pull_request:
    branches: [main]

# Jobs get nothing beyond reading the repository
permissions: {}

# A newer push to a PR cancels its older run; runs on main and tags always
# finish, so every commit is tested and published in order
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: '24'

jobs:
  # Fast checks first
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal -c clippy,rustfmt && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: mudd -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check formatting
        run: cargo fmt --check
        working-directory: mudd
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
        working-directory: mudd

  # Build and test
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: mudd -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build
        run: cargo build --locked --release
        working-directory: mudd
      - name: Run tests
        run: cargo test --locked --release
        working-directory: mudd

  # Frontend lint and build
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install dependencies
        run: npm ci --ignore-scripts
        working-directory: client
      - name: Lint
        run: npm run lint
        working-directory: client
      - name: Type-check e2e tests
        run: npm run typecheck:e2e
        working-directory: client
      - name: Build
        run: npm run build
        working-directory: client

  # Browser end-to-end tests against a real mudd
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: mudd -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Build mudd
        run: cargo build --locked --release --bins
        working-directory: mudd
      - name: Install client dependencies
        run: npm ci --ignore-scripts
        working-directory: client
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: client
      - name: Build client
        run: npm run build
        working-directory: client
      - name: Run Playwright
        run: npm run test:e2e
        working-directory: client
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            client/playwright-report/
            client/test-results/
          retention-days: 7

  # Supply chain: known vulnerabilities, licenses, sources
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-deny
      - name: cargo deny
        run: cargo deny --locked check
        working-directory: mudd
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: npm audit (shipped dependencies)
        run: npm audit --omit=dev --audit-level=moderate
        working-directory: client
      - name: npm audit signatures
        run: npm ci --ignore-scripts && npm audit signatures
        working-directory: client

  # Static analysis of these workflows
  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@bd12b495c90993a4301c73398142281a61499af3 # v0.9.0
        with:
          advanced-security: false

  # Container image: build-only check on PRs
  container-check:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    uses: ./.github/workflows/container.yml
    with:
      publish: false

  # Container image: publish to GHCR after every other job passes
  container-publish:
    if: github.event_name == 'push'
    needs: [lint, build, frontend, e2e, audit, zizmor]
    # One publish at a time, so :edge ends on the newest commit
    concurrency:
      group: container-publish
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      # GitHub artifact attestation (gh attestation verify)
      id-token: write
      attestations: write
    uses: ./.github/workflows/container.yml
    with:
      publish: true
